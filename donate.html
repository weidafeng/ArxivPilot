<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>支持 ArxivPilot</title>
  <style>
    body {
      margin: 0;
      background: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #333;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.10);
      padding: 32px 40px;
      text-align: center;
      max-width: 340px;
    }
    .logo {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 20px;
      color: #b31b1b;
      margin: 0 0 6px;
    }
    p {
      font-size: 13px;
      color: #666;
      margin: 0 0 20px;
      line-height: 1.6;
    }
    .qr {
      width: 200px;
      height: 200px;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid #eee;
    }
    .label {
      margin-top: 12px;
      font-size: 13px;
      color: #555;
    }
    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #bbb;
    }
    .footer a {
      color: #bbb;
      text-decoration: none;
    }
    .footer a:hover {
      color: #b31b1b;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="icons/icon128.png" alt="ArxivPilot" />
    <h1>感谢支持 ArxivPilot</h1>
    <p>如果这个插件帮你节省了时间，<br>一杯咖啡的鼓励让我持续维护 ☕</p>
    <img class="qr" src="images/wechat.jpg" alt="微信收款码" />
    <div class="label">微信扫码打赏</div>
    <div class="footer">
      关注公众号 <strong>特里斯丹</strong> 获取更多工具<br>
      <a href="https://github.com/weidafeng" target="_blank">GitHub @weidafeng</a>
    </div>
  </div>
</body>
</html>
